# Keep Cooking — XcodeGen project spec (PASS 1: full Xcode project).
# Generated project: apps/ios/Smidgen.xcodeproj (`xcodegen generate` from apps/ios).
# (Filename stays Smidgen.xcodeproj for Xcode Cloud compatibility — the
# workflow is pinned to apps/ios/Smidgen.xcodeproj. App display name,
# targets, and schemes are KeepCooking; legacy Smidgen.* scheme aliases
# are kept alongside so old + new workflow configs both resolve.)
# WARNING: `xcodegen generate` REWRITES Config/Info-*.plist and
# Config/AppGroups.entitlements from scratch (verified: custom keys like
# NSExtension/NSCameraUsageDescription are wiped). Back up Config/ before
# regenerating, then restore + re-apply. Long-term fix: move custom keys
# into `info.properties`.
# Toolchain: Xcode 27.2, iOS 17+ (iPhone+iPad), watchOS 10+.
#
# Decisions (recorded):
# - XcodeGen (2.48.0, brew) instead of a hand-written pbxproj: the 36 loose
#   Swift files change often; regenerating beats hand-merging GUIDs.
# - Bundle IDs: app org.smidgen.app (seed); widgets org.smidgen.app.widgets;
#   share org.smidgen.app.share; tests org.smidgen.app.tests;
#   watch org.smidgen.app.watch.
# - AppIntents live IN-APP (Intents/ in the KeepCooking target). A separate
#   AppIntent extension target was considered and rejected: triple the
#   SwiftData model duplication for zero offline benefit; Shortcuts works
#   from the app target on iOS 17+.
# - App Groups: SINGLE group group.com.smidgen.share (lane 1
#   ios-packaging) shared by the app + both extensions + watch via one
#   shared entitlements file (Config/AppGroups.entitlements). WidgetSnapshot
#   and Watch payloads ride the same suite as the ShareStore bridge.
# - Watch: real watchOS app target (KeepCookingWatch, standalone, own scheme).
#   NOT embedded in the iOS app (avoids Embed Watch Content fragility);
#   pair at distribution time. If SDK pairing ever blocks, this target is
#   the documented stub-host seam.
# - Tests: standalone KeepCookingTests unit-test bundle (NO app host) compiling
#   the *Tests.swift files plus the pure-logic sources they exercise
#   (Foundation-only, plus ClipboardBanner/OCRScanView/Models for the
#   ClipboardDetector/OCRSplitter/Recipe paths). Matches the files' own
#   header notes ("no import needed when in the same test target").
# - Widgets extension compiles Core/Models.swift alongside the widget
#   sources so SnapshotWriter (same file as the providers) resolves
#   Plan/Recipe/ShoppingList without source edits.
# - SWIFT_VERSION pinned to 5.0: the 36 files were validated with
#   `swiftc -parse` only; Swift 6 strict concurrency is a later lane.
name: KeepCooking

options:
  bundleIdPrefix: org.smidgen.app
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'

configs:
  Debug: debug
  Release: release

settings:
  SWIFT_VERSION: '5.0'
  # Release plumbing: single source of truth for version/build. The
  # Config/Info-*.plist files reference these as
  # $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) so Xcode Cloud
  # ci_pre_xcodebuild.sh can stamp a unique build number per upload.
  # NOTE: `xcodegen generate` rewrites Config/Info-*.plist from scratch —
  # re-apply the $(...) version keys by hand after any regen (see warning
  # at the top of this file). Do NOT run `xcodegen generate` casually.
  MARKETING_VERSION: '1.0'
  CURRENT_PROJECT_VERSION: '1'
  # Lane 1 ios-packaging: automatic signing. TODO — replace YOUR_TEAM_ID with
  # the real Apple Developer Portal Team ID (requires portal access).
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: YOUR_TEAM_ID
  # Prod API URL seam (lane 1 ios-packaging): Info-App.plist exposes this as
  # SMIDGEN_API_BASE_URL. Default is the production Worker; override
  # per-config (or via `xcodebuild SMIDGEN_API_BASE_URL=...`) for local dev.
  SMIDGEN_API_BASE_URL: https://keepcooking.app/api

targets:
  KeepCooking:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      # Swift-only: doc/sample files (*.md, EXPORT_SAMPLES/*) must not land
      # in the bundle as resources (duplicate README.md filenames collide).
      - path: App
        includes: ['**/*.swift']
        excludes: ['**/*Tests.swift']
      - path: Core
        includes: ['**/*.swift']
        excludes: ['**/*Tests.swift']
      - path: Export
        includes: ['**/*.swift']
        excludes: ['**/*Tests.swift']
      - path: Features
        includes: ['**/*.swift']
        excludes: ['**/*Tests.swift']
      - path: Intents
        includes: ['**/*.swift']
        excludes: ['**/*Tests.swift']
      - path: Sync
        includes: ['**/*.swift']
        excludes: ['**/*Tests.swift']
      # Widgets: app compiles ONLY the Foundation-only snapshot reader
      # (WidgetSnapshot.swift). KeepCookingWidgets.swift (WidgetKit @main) must
      # NOT compile into the app target — it lives in KeepCookingWidgets only.
      - path: Widgets/WidgetSnapshot.swift
      - path: ShareExtension/ShareStore.swift
      # Frozen contract seeds → bundle/Seed/*.json so first launch demos
      # offline (SeedLoader.loadBundledSeeds). Copied from
      # packages/contracts/seed (read-only source; do not edit JSON here).
      - path: Seed
        includes: ['*.json']
        buildPhase: resources
      # Privacy manifest → bundle root (one shared file, three upload targets).
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      # App icon set skeleton (designer fills PNGs; see AppIcon.appiconset).
      - path: App/Assets.xcassets
    dependencies:
      - target: KeepCookingWidgets
      - target: KeepCookingShare
    info:
      path: Config/Info-App.plist
      # Generation-safety (engine lane owns the plist): XcodeGen rewrites
      # Config/Info-*.plist from scratch, so these keys live here as the
      # source of truth and are merged back on every `xcodegen generate`.
      # Strings must match Config/Info-App.plist exactly.
      properties:
        NSMicrophoneUsageDescription: "Listen for hands-free cook commands while the recipe is on screen."
        NSSpeechRecognitionUsageDescription: "Recognize cook commands like Next step on-device."
        # Deep link for the Share extension's "Open in Keep Cooking" button:
        # smidgen://clip?url=<pct-encoded>. Mirror of Config/Info-App.plist
        # CFBundleURLTypes (xcodegen rewrites that plist from scratch).
        # Only host `clip` is claimed; smidgen://invite/<code> stays stubbed.
        CFBundleURLTypes:
          - CFBundleURLName: org.smidgen.app
            CFBundleURLSchemes: [smidgen]
    entitlements:
      path: Config/AppGroups.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.smidgen.app
      TARGETED_DEVICE_FAMILY: '1,2'
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'

  KeepCookingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Widgets/KeepCookingWidgets.swift
      - path: Widgets/WidgetSnapshot.swift
      - path: Core/Models.swift
      # Privacy manifest → extension bundle root.
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Config/Info-Widgets.plist
    entitlements:
      path: Config/AppGroups.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.smidgen.app.widgets
      TARGETED_DEVICE_FAMILY: '1,2'
      MARKETING_VERSION: '1.0'
      CURRENT_widgetsECT_VERSION: 1

  KeepCookingShare:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: ShareExtension/ShareViewController.swift
      - path: ShareExtension/ShareStore.swift
      # Privacy manifest → extension bundle root.
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Config/Info-Share.plist
      # Generation-safety: `xcodegen generate` rewrites Config/Info-*.plist
      # from scratch — these keys are the source of truth and are merged
      # back on every regen. Must match Config/Info-Share.plist.
      # NSExtensionPrincipalClass MUST stay module-qualified
      # ($(PRODUCT_MODULE_NAME).ShareViewController): bare
      # "ShareViewController" fails Swift class lookup → blank share sheet.
      properties:
        CFBundleDisplayName: Keep Cooking Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Config/AppGroups.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.smidgen.app.share
      TARGETED_DEVICE_FAMILY: '1,2'
      MARKETING_VERSION: '1.0'
      CURRENT_shareECT_VERSION: 1

  KeepCookingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      # Pure-logic sources under test (no app host; same-target convention).
      - path: Core/Models.swift
      - path: Sync/SyncCrypto.swift
      - path: Sync/SyncEngine.swift
      - path: Sync/DeviceAuth.swift
      - path: App/BYOE2E.swift
      - path: Features/Ingest/IngredientParser.swift
      - path: Features/Ingest/ClipModels.swift
      - path: Features/Ingest/ClipboardBanner.swift
      - path: Features/Ingest/OCRScanView.swift
      - path: Features/Ingest/IngestStepsHeader.swift
      - path: Features/Cook/RecipeScaler.swift
      - path: Features/Cook/StepTimerParser.swift
      - path: Features/Cook/CookSession.swift
      - path: Features/Cook/VoiceCommandParser.swift
      - path: Features/Plan/PlanAggregation.swift
      - path: Features/Plan/MenuPlanning.swift
      - path: Features/Shop/ShopHelpers.swift
      - path: Features/Library/DuplicateFinder.swift
      - path: Features/Library/LibrarySearch.swift
      # The XCTest suites.
      - path: Sync/SyncEngineTests.swift
      - path: Features/Ingest/IngredientParserTests.swift
      - path: Features/Ingest/IngestHumanPolishTests.swift
      - path: Features/Cook/CookTests.swift
      - path: Features/Plan/MenuPlanningTests.swift
      - path: Features/Library/DuplicateFinderTests.swift
      - path: Features/Library/LibrarySearchTests.swift
    info:
      path: Config/Info-Tests.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.smidgen.app.tests
      TARGETED_DEVICE_FAMILY: '1,2'
      MARKETING_VERSION: '1.0'
      CURRENT_testsECT_VERSION: 1

  KeepCookingWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: watch/WatchViews.swift
      - path: Widgets/WidgetSnapshot.swift
    info:
      path: Config/Info-Watch.plist
    entitlements:
      path: Config/AppGroups.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.smidgen.app.watch
      MARKETING_VERSION: '1.0'
      CURRENT_PROJECT_VERSION: 1

  # PASS 2 demos: XCUITest bundle driving the three recorded flows
  # (offline-launch, ingest-save, plan-to-list) deterministically while
  # `xcrun simctl io booted recordVideo` captures the MP4s.
  KeepCookingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: UITests
    dependencies:
      - target: KeepCooking
    info:
      path: Config/Info-Tests.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.smidgen.app.uitests
      TARGETED_DEVICE_FAMILY: '1,2'

# Schemes are explicit and shared (committed under
# Smidgen.xcodeproj/xcshareddata/xcschemes/) so every clone and Xcode Cloud
# resolves `-scheme KeepCooking` identically. Keep this list in sync with targets.
schemes:
  KeepCooking:
    build:
      targets:
        KeepCooking: all
    run:
      config: Debug
    archive:
      config: Release
  KeepCookingTests:
    build:
      targets:
        KeepCookingTests: all
    test:
      config: Debug
      targets:
        - KeepCookingTests
  KeepCookingWatch:
    build:
      targets:
        KeepCookingWatch: all
    run:
      config: Debug
